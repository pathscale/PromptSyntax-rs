[package]
name = "promptsyntax-capi"
version = "0.1.0"
edition = "2024"
description = "Stable C ABI for the Prompt Syntax Rust parser"
license = "MIT"
repository = "https://github.com/pathscale/PromptSyntax-rs"
publish = false

[lib]
name = "promptsyntax_capi"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
promptsyntax = { path = "../..", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
