[package]
name = "promptsyntax"
version = "0.2.0"
edition = "2024"
description = "A provenance-aware parser for Prompt Syntax"
license = "MIT"
repository = "https://github.com/pathscale/PromptSyntax-rs"
readme = "README.md"
keywords = ["prompt", "parser", "ai", "control-plane"]
categories = ["parser-implementations"]

[workspace]
members = ["crates/promptsyntax-capi"]
resolver = "3"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-ident = "1"
unicode-normalization = "0.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
