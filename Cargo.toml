[package]
name = "promptsyntax"
version = "0.1.0"
edition = "2024"
description = "A provenance-aware parser for Prompt Syntax"
repository = "https://github.com/pathscale/PromptSyntax-rs"
readme = "README.md"
keywords = ["prompt", "parser", "ai", "control-plane"]
categories = ["parser-implementations"]
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
unicode-ident = "1"
unicode-normalization = "0.1"

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"

